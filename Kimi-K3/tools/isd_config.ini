#
# isd_download config for M-Vave FM-1 (JieLi BR22 / AC693N)
# Derived from the FM-1's compiled isd_config + the BR23 SDK template.
#

[EXTRA_CFG_PARAM]
NEW_FLASH_FS=YES;
FORCE_VM_ALIGN=YES;
CHIP_NAME=AC693N;
ENTRY=0x020000A0;
PID=FM-1_synth;
VID=0.01;

RESERVED_OPT=0;
SPECIAL_OPT=0;
FORCE_4K_ALIGN=YES;

DOWNLOAD_MODEL=usb;

LOADER_BAUD_RATE=1000000;
LOADER_ASK_BAUD_RATE=1000000;
BEFORE_LOADER_WAIT_TIME=100;
FLASH_BIN_CNT=6;
NEED_RESERVED_4K=YES;

[BURNER_OPTIONS]
SDK_TYPE=OTHER;

[CHIP_VERSION]
SUPPORTED_LIST=A,B,D,E;

[SYS_CFG_PARAM]
SPI=2_3_0_0;
UTTX=PB04;
UTBD=1000000;
RESET=PB01_08_0;
UPDATE_JUMP=0;
EX_FLASH=PA03_1A_NULL;
psram=0;
VLVD=4;
ENABLE_SDRAM=0;
SDRAM_REFRESH_TIME=0;
SDRAM_REFRESH_CYCLES=0x10;
SDRAM_MODE=0;
SDRAM_COLUM=0;
SDRAM_SIZE=0;
SDRAM_PLL3_EN=0;
SDRAM_PLL3_NOUSB_EN=0;
SDRAM_CL=2;
SDRAM_DQ_DLY_TRM=4;
SDRAM_WLCNT=3;
SDRAM_D_DLY=1;
SDRAM_RLCNT=3;
SDRAM_Q_DLY=1;
SDRAM_PHASE=3;
SDRAM_TRFC=0x3c;
SDRAM_TRP=0x12;
SDRAM_TRCD=0x12;
SDRAM_TRRD=0xc;
SDRAM_TWTR=0x14;
SDRAM_TRTW=0x3c;
SDRAM_TWR=0x3c;
SDRAM_TRC=0x37;
SDRAM_DQS_DLY_TRM=4;
SDRAM_UDQS_DLY_TRM=4;
SDRAM_DQ_DLY_INNER=4;

# ---- flash partition table (mirrors the stock FM-1 layout) ----
[RESERVED_CONFIG]
BTIF_ADR=AUTO;
BTIF_LEN=0x1000;
BTIF_OPT=1;

PRCT_ADR=0;
PRCT_LEN=CODE_LEN;
PRCT_OPT=2;

VM_ADR=AUTO;
VM_LEN=0x55000;
VM_OPT=1;

USERIF_ADR=AUTO;
USERIF_LEN=0x12000;
USERIF_OPT=1;

[BURNER_CONFIG]
SIZE=32;

[TOOL_CONFIG]
1TO2_MIN_VER=2.24.5;
1TO8_MIN_VER=3.0.38;
